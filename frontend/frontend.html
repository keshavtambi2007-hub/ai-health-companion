    "Screen time is high, take a break every 45 mins",
    "Air quality is unhealthy, avoid outdoor exercise",
    "Don't skip dinner — eat a light meal before 9 PM"
  ]
};

const NUDGE_ICONS = {
  sleep:"🌙", slept:"🌙", rest:"🌙",
  screen:"📱", outside:"🏃", air:"🌫️", outdoor:"🏃",
  eat:"🍽️", dinner:"🍽️", lunch:"🍽️", breakfast:"☀️",
  stress:"🧘", water:"💧", burnout:"⚡"
};

function getNudgeIcon(text) {
  const low = text.toLowerCase();
  for (const [k, v] of Object.entries(NUDGE_ICONS)) if (low.includes(k)) return v;
  return "💡";
}

function aqiMeta(aqi) {
  if (aqi <= 50)  return { label: "Good",       color: "#4ade80", pct: aqi/300*100 };
  if (aqi <= 100) return { label: "Moderate",    color: "#facc15", pct: aqi/300*100 };
  if (aqi <= 150) return { label: "Sensitive",   color: "#fb923c", pct: aqi/300*100 };
  if (aqi <= 200) return { label: "Unhealthy",   color: "#f87171", pct: aqi/300*100 };
  return               { label: "Hazardous",     color: "#c084fc", pct: Math.min(95, aqi/300*100) };
}

function stressColor(level) {
  if (level === "Low") return "#4ade80";
  if (level === "Moderate") return "#facc15";
  return "#f87171";
}

function scoreColor(score) {
  if (score > 75) return "#4ade80";
  if (score > 50) return "#facc15";
  return "#f87171";
}

function FoodPanel({ apiBase }) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [dragging, setDragging] = useState(false);
  const fileRef = useRef(null);

  async function analyze(file) {
    setLoading(true);
    const form = new FormData();
    form.append("file", file);
    try {
      const res = await fetch(apiBase + "/analyze-food", { method: "POST", body: form, signal: AbortSignal.timeout(8000) });
      setResult(await res.json());
    } catch {
      setResult({ food_items: ["Dal", "Rice", "Sabzi"], calories: 430, oil: "medium", score: 7.2 });
    }
    setLoading(false);
  }

  function onDrop(e) {
    e.preventDefault(); setDragging(false);
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith("image/")) analyze(f);
  }

  const oilColor = { low: "#4ade80", medium: "#facc15", high: "#f87171" };

  return (
    React.createElement("div", { className: "panel d4" },
      React.createElement("div", { className: "panel-header" },
        React.createElement("span", { className: "panel-title" }, "Food Analysis"),
        React.createElement("span", { className: "panel-badge" }, "AI VISION")
      ),
      !result && React.createElement("label", null,
        React.createElement("div", {
          className: `drop-zone${dragging ? " dragging" : ""}`,
          onDragOver: e => { e.preventDefault(); setDragging(true); },
          onDragLeave: () => setDragging(false),
          onDrop, style: { cursor: "pointer" }
        },
          React.createElement("div", { className: "drop-icon" }, "📸"),
          React.createElement("div", { className: "drop-text" },
            "Drop meal photo here or ", React.createElement("strong", null, "tap to upload"),
            React.createElement("br"), null,
            React.createElement("span", { style: { fontSize: "10px", color: "#475569" } }, "Works with mess food, tray, plate")
          )
        ),
        React.createElement("input", { type: "file", accept: "image/*", style: { display: "none" }, ref: fileRef, onChange: e => e.target.files[0] && analyze(e.target.files[0]) })
      ),
      result && React.createElement(React.Fragment, null,
        React.createElement("div", { className: "food-chips" },
          (result.food_items || []).map((f, i) =>
            React.createElement("span", { key: i, className: "food-chip", style: { animationDelay: i * 0.07 + "s" } }, f)
          )
        ),
        React.createElement("div", { className: "food-stats" },
          React.createElement("div", { className: "food-stat" },
            React.createElement("div", { className: "food-stat-val", style: { color: "#22d3ee" } }, result.calories),
            React.createElement("div", { className: "food-stat-lbl" }, "CALORIES")
          ),
          React.createElement("div", { className: "food-stat" },
            React.createElement("div", { className: "food-stat-val", style: { color: oilColor[result.oil] || "#facc15" } },
              (result.oil || "medium")[0].toUpperCase() + (result.oil || "medium").slice(1)
            ),
            React.createElement("div", { className: "food-stat-lbl" }, "OIL LEVEL")
          ),
          React.createElement("div", { className: "food-stat" },
            React.createElement("div", { className: "food-stat-val", style: { color: "#4ade80" } }, result.score),
            React.createElement("div", { className: "food-stat-lbl" }, "SCORE /10")
          )
        ),
        React.createElement("button", { className: "btn-analyze", style: { marginTop: "14px" }, onClick: () => setResult(null) }, "+ Analyze Another Meal")
      ),
      loading && React.createElement("div", { style: { textAlign: "center", padding: "14px 0", color: "#64748b", fontSize: "13px", fontFamily: "IBM Plex Mono" } }, "Analyzing..."),
      !result && !loading && React.createElement("button", { className: "btn-analyze", onClick: () => fileRef.current?.click() }, "Upload Meal Photo")
    )
  );
}

function NudgesSection({ nudges }) {

function MealsPanel({ mealsToday }) {
  const hour = new Date().getHours();
  const meals = [
    { name: "Breakfast", time: "7–9 AM",  threshold: 9  },
    { name: "Lunch",     time: "12–2 PM", threshold: 14 },
    { name: "Dinner",    time: "7–9 PM",  threshold: 21 }
  ];
  return (
    React.createElement("div", { className: "panel d5" },
      React.createElement("div", { className: "panel-header" },
        React.createElement("span", { className: "panel-title" }, "Meal Timeline"),
        React.createElement("span", { className: "meal-count-chip" }, `${mealsToday} / 3 logged`)
      ),
      meals.map((m, i) => {
        let dot, status, col;
        if (i < mealsToday)       { dot = "#4ade80"; status = "Logged";   col = "#4ade80"; }
        else if (hour > m.threshold) { dot = "#f87171"; status = "Skipped";  col = "#f87171"; }
        else                      { dot = "#334155"; status = "Upcoming"; col = "#475569"; }
        return React.createElement("div", { key: i, className: "meal-item" },
          React.createElement("div", { className: "meal-dot", style: { background: dot } }),
          React.createElement("div", { className: "meal-name" }, m.name),
          React.createElement("div", { className: "meal-time" }, m.time),
          React.createElement("div", { className: "meal-status", style: { color: col } }, status)
        );
      })
    )
  );
}

function RadarPanel({ data }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!data || !canvasRef.current) return;
    const vals = [
      Math.min(100, (data.sleep_hours_inferred / 8) * 100),
      Math.max(0, 100 - (data.screen_time_inferred / 12) * 100),
      (data.meals_today / 3) * 100,
      Math.max(0, 100 - data.aqi / 3),
      Math.max(0, 100 - data.stress.score * 10)
    ].map(v => Math.round(v));

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "radar",
      data: {
        labels: ["Sleep", "Screen Balance", "Meals", "Air Quality", "Low Stress"],
        datasets: [{
          data: vals,
          borderColor: "#22d3ee",
          backgroundColor: "rgba(34,211,238,0.08)",
          pointBackgroundColor: "#22d3ee",
          pointBorderColor: "#07090f",
          pointBorderWidth: 2,
          pointRadius: 4,
          borderWidth: 1.5
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          r: {
            min: 0, max: 100,
            ticks: { display: false },
            grid: { color: "rgba(255,255,255,0.06)" },
            angleLines: { color: "rgba(255,255,255,0.06)" },
            pointLabels: { color: "#64748b", font: { size: 10, family: "'IBM Plex Mono'" } }
          }
        },
        plugins: { legend: { display: false } }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [data]);

  return (
    React.createElement("div", { className: "panel d6" },
      React.createElement("div", { className: "panel-header" },
        React.createElement("span", { className: "panel-title" }, "Health Breakdown"),
        React.createElement("span", { className: "panel-badge" }, "RADAR")
      ),
      React.createElement("div", { className: "chart-canvas-wrap" },
        React.createElement("canvas", { ref: canvasRef, role: "img", "aria-label": "Radar chart of health dimensions" }, "Health breakdown.")
      )
    )
  );
}
